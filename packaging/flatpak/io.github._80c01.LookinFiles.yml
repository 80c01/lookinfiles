app-id: io.github._80c01.LookinFiles
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: lookinfiles

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=host
  - --filesystem=home
  - --share=network
  - --device=dri
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /man
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: vte
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dgir=false
      - -Dvapi=false
      - -Dgtk3=false
      - -Dgtk4=true
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/vte/-/archive/0.78.0/vte-0.78.0.tar.bz2
        sha256: 058866164d1f230ba278dfb696f01df22e2ce2d7ca8cb655822262d1c6df811c

  - name: libgit2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=OFF
      - -DBUILD_CLI=OFF
    sources:
      - type: archive
        url: https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.0.tar.gz
        sha256: 75b27d4d6df44bd34e2f70663cfd998f5ec41e680e1e593238bbe517a84c7ed2

  - name: lookinfiles
    buildsystem: simple
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install PREFIX=/app
    sources:
      - type: dir
        path: ../../
