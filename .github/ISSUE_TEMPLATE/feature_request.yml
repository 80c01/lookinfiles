name: Feature request
description: Suggest a new feature or a new preview format.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested solution
      description: How it could work, including the key you would use if it is a shortcut.
  - type: textarea
    id: sample
    attributes:
      label: Sample files
      description: For a new preview format, attach or link a small sample file.
