name: Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/packages.yml'
      - 'Makefile'
      - 'src/**'
      - 'data/**'
  workflow_dispatch:

jobs:
  debian:
    name: Debian / Ubuntu (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libgit2-dev \
            libvte-2.91-gtk4-dev libgtksourceview-5-dev libpoppler-glib-dev \
            libsqlite3-dev libarchive-dev libwebkitgtk-6.0-dev libgstreamer-plugins-base1.0-dev

      - name: Build .deb
        run: ./packaging/debian/build_deb.sh artifacts/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: artifacts/*.deb

  arch:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools & dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git gtk4 libgit2 vte4 gtksourceview5 poppler-glib sqlite webkitgtk-6.0 libarchive

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare unprivileged build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build package with makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(sh tools/version.sh)
          make dist VERSION="${VERSION}"
          cp lookinfiles-${VERSION}.tar.gz packaging/arch/
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          chown -R builder:builder .
          su builder -c "
            cd packaging/arch
            makepkg -s --noconfirm --nocheck
          "
          mkdir -p artifacts
          cp packaging/arch/*.pkg.tar.zst artifacts/

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: artifacts/*.pkg.tar.zst

  fedora:
    name: Fedora RPM (.rpm)
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install build tools & dependencies
        run: |
          dnf install -y gcc make pkgconfig desktop-file-utils libappstream-glib rpmdevtools \
            gtk4-devel libgit2-devel vte291-gtk4-devel gtksourceview5-devel poppler-glib-devel sqlite-devel \
            webkitgtk6.0-devel libarchive-devel gstreamer1-plugins-base-devel git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build source tarball and RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpmdev-setuptree
          VERSION=$(sh tools/version.sh)
          make dist VERSION="${VERSION}"
          cp lookinfiles-${VERSION}.tar.gz ~/rpmbuild/SOURCES/
          sed "s/^Version:.*/Version:        ${VERSION}/" packaging/fedora/lookinfiles.spec > ~/rpmbuild/SPECS/lookinfiles.spec
          rpmbuild -ba ~/rpmbuild/SPECS/lookinfiles.spec
          mkdir -p artifacts
          cp ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm artifacts/

      - name: Upload Fedora packages
        uses: actions/upload-artifact@v4
        with:
          name: fedora-packages
          path: artifacts/*.rpm

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libgit2-dev \
            libvte-2.91-gtk4-dev libgtksourceview-5-dev libpoppler-glib-dev \
            libsqlite3-dev libarchive-dev libwebkitgtk-6.0-dev curl file
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Build AppImage
        run: ./packaging/appimage/build_appimage.sh artifacts/

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: artifacts/*.AppImage

  windows:
    name: Windows (.zip, .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libgit2
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libarchive
            diffutils
            make
            zip

      # The single-file .exe embeds the portable zip, which it builds first
      - name: Build Windows packages
        shell: msys2 {0}
        run: |
          ./packaging/windows/build_windows_exe.sh artifacts/
          cp build/lookinfiles-*-windows-x86_64.zip artifacts/

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            artifacts/*.zip
            artifacts/*.exe

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [debian, arch, fedora, appimage, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Publish Release with assets
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: all-artifacts/*
          generate_release_notes: true
