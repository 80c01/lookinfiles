# 2020s: soft pastel dark themes, as popularised by community palettes of
# the decade. Cool, slightly purple surfaces, low-contrast borders, pastel
# accents with dark text on fills, tinted shadows and diff backgrounds,
# a geometric UI font and a code font with ligatures.
