# 1980s: the IBM PC in colour text mode (CGA, then EGA and VGA). Blue
# screens with cyan and yellow text, as in the DOS IDEs and two-panel file
# managers of the decade, a cyan selection bar, a black DOS prompt. Text
# and terminal colours are the 16 colours of the CGA palette, brown
# included; only a few surfaces use in-between blues.
[Theme]
name=1980s Text Mode
dark=true

[Colors]
# Surfaces: blue panels and editor, black bars, dialogs and prompt
bg_window=#0000aa
bg_bar=#000000
bg_view=#0000aa
bg_terminal=#000000
bg_raised=#000000
bg_input=#0000aa
bg_block=#00008a
bg_code_inline=#000080
bg_hover=#0000cc
bg_selected=#007a7a
bg_selected_inactive=#555555
hover_overlay=#5555ff
shadow=#000000
scrollbar=#55ffff
# Lines: the double-line boxes
border=#5555ff
border_strong=#ffffff
rule=#5555ff
# Text: cyan interface, yellow file text
fg=#55ffff
fg_text=#ffff55
fg_strong=#ffffff
fg_bright=#ffffff
fg_muted=#aaaaaa
fg_subtle=#55ffff
fg_faint=#aaaaaa
# Accent and states
accent=#00aaaa
accent_hover=#55ffff
accent_fg=#ffffff
accent_text=#000000
focus_ring=#ffff55
link=#55ffff
error=#ff7070
warning=#ffff55
success=#55ff55
highlight=#00aaaa
highlight_fg=#000000
# Badges
badge_red=#aa0000
badge_green=#00aa00
badge_blue=#5555ff
badge_orange=#aa5500
badge_fg=#ffffff
# Git
git_modified=#ffff55
git_added=#55ff55
git_deleted=#ff5555
git_conflict=#ff55ff
git_renamed=#55ffff
gutter_added=#55ff55
gutter_modified=#55ffff
gutter_deleted=#ff5555
diff_added_fg=#55ff55
diff_added_bg=#003300
diff_removed_fg=#ff5555
diff_removed_bg=#330000
diff_hunk_fg=#55ffff
diff_hunk_bg=#000055
# Syntax: 16 colours, so roles share them
syn_comment=#aaaaaa
syn_keyword=#ffffff
syn_control=#55ff55
syn_string=#55ffff
syn_number=#ff55ff
syn_type=#ffffff
syn_function=#ffff55
syn_variable=#ffff55
syn_escape=#ff55ff
syn_constant=#55ffff
syn_error=#ff5555
# Editors
editor_selection=#007a7a
editor_current_line=#00008a
editor_cursor=#ffff55
editor_bracket=#5555ff
editor_occurrence=#3333cc
editor_match=#aa5500
editor_match_current=#aa00aa
# Terminal: the CGA palette
term_fg=#aaaaaa
term_cursor=#aaaaaa
ansi_black=#000000
ansi_red=#aa0000
ansi_green=#00aa00
ansi_yellow=#aa5500
ansi_blue=#0000aa
ansi_magenta=#aa00aa
ansi_cyan=#00aaaa
ansi_white=#aaaaaa
ansi_bright_black=#555555
ansi_bright_red=#ff5555
ansi_bright_green=#55ff55
ansi_bright_yellow=#ffff55
ansi_bright_blue=#5555ff
ansi_bright_magenta=#ff55ff
ansi_bright_cyan=#55ffff
ansi_bright_white=#ffffff

[Fonts]
# The 8x16 VGA ROM font, recreated as outline fonts
ui=Px437 IBM VGA 8x16, Perfect DOS VGA 437, Fixedsys Excelsior, monospace
ui_size=16
code=Px437 IBM VGA 8x16, Perfect DOS VGA 437, Fixedsys Excelsior, monospace
code_size=16
