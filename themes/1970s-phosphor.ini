# 1970s: the video terminal (VT52, VT100, ADM-3A) on a green P1 phosphor
# CRT. One colour, shown at a few intensities: dim for comments and
# metadata, bright for keywords and titles, reverse video for selections
# and marked text. Even the ANSI colours are shades of green.
[Theme]
name=1970s Phosphor
dark=true

[Colors]
# Surfaces: the black glass of the tube, tinted by the phosphor
bg_window=#0a110a
bg_bar=#071007
bg_view=#050b05
bg_terminal=#050b05
bg_raised=#0d1a0d
bg_input=#102010
bg_block=#0b170b
bg_code_inline=#112411
bg_hover=#123012
bg_selected=#1f5c1f
bg_selected_inactive=#173a17
hover_overlay=#2f7a2f
shadow=#000000
scrollbar=#33aa33
# Lines
border=#143014
border_strong=#1f5a1f
rule=#1a401a
# Text: normal, bold (brighter) and half-bright (dimmer) intensities
fg=#2ee62e
fg_text=#33ff33
fg_strong=#66ff66
fg_bright=#ccffcc
fg_muted=#26c026
fg_subtle=#1fa51f
fg_faint=#188018
# Accent and states
accent=#33ff33
accent_hover=#66ff66
accent_fg=#99ff99
accent_text=#031003
focus_ring=#66ff66
link=#99ff99
error=#ccffcc
warning=#99ff66
success=#33ff33
# Reverse video
highlight=#33ff33
highlight_fg=#031003
# Badges: reverse video
badge_red=#66ff66
badge_green=#33cc33
badge_blue=#2aa62a
badge_orange=#99ff33
badge_fg=#031003
# Git
git_modified=#ccff66
git_added=#66ff66
git_deleted=#1fa51f
git_conflict=#e6ffe6
git_renamed=#99ffcc
gutter_added=#33ff33
gutter_modified=#99ff33
gutter_deleted=#ccffcc
diff_added_fg=#99ff99
diff_added_bg=#0d260d
diff_removed_fg=#26c026
diff_removed_bg=#151f05
diff_hunk_fg=#ccffcc
diff_hunk_bg=#0d1a0d
# Syntax: intensities only
syn_comment=#1fa51f
syn_keyword=#66ff66
syn_control=#99ff99
syn_string=#33cc33
syn_number=#66ff99
syn_type=#66ff66
syn_function=#33ff33
syn_variable=#2ee62e
syn_escape=#ccff99
syn_constant=#99ff99
syn_error=#ccffcc
# Editors: a block cursor, no syntax-aware decoration
editor_selection=#1f7a1f
editor_current_line=#0a1a0a
editor_cursor=#33ff33
editor_bracket=#1f5c1f
editor_occurrence=#143a14
editor_match=#1f5c1f
editor_match_current=#2f8f2f
editor_ruler=#ccffcc
# Terminal: every ANSI colour is a green intensity
term_fg=#33ff33
term_cursor=#33ff33
ansi_black=#050b05
ansi_red=#2aa62a
ansi_green=#33ff33
ansi_yellow=#66ff66
ansi_blue=#1f8a1f
ansi_magenta=#33cc33
ansi_cyan=#66ff99
ansi_white=#33ff33
ansi_bright_black=#188018
ansi_bright_red=#66ff66
ansi_bright_green=#66ff66
ansi_bright_yellow=#99ff99
ansi_bright_blue=#33aa33
ansi_bright_magenta=#66ff66
ansi_bright_cyan=#99ffcc
ansi_bright_white=#ccffcc

[Fonts]
# Character-cell terminal fonts everywhere, the interface included
ui=VT323, Glass TTY VT220, IBM Plex Mono, DejaVu Sans Mono, monospace
ui_size=16
code=VT323, Glass TTY VT220, IBM Plex Mono, DejaVu Sans Mono, monospace
code_size=16
