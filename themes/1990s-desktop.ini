# 1990s: the grey 3D desktop (Windows 3.x, 95 and NT 4). Silver surfaces
# with bevelled borders, navy selections, white documents, a black console
# window. Syntax colouring as in the IDEs of the late 90s: keywords blue,
# comments green, nearly everything else black. Colours come from the
# 16-colour system palette, plus the 256-colour "sky blue".
[Theme]
name=1990s Desktop
dark=false

[Colors]
# Surfaces
bg_window=#c0c0c0
bg_bar=#c0c0c0
bg_view=#ffffff
bg_terminal=#000000
bg_raised=#c0c0c0
bg_input=#ffffff
bg_block=#f0f0f0
bg_code_inline=#e0e0e0
bg_hover=#d4d4d4
bg_selected=#000080
bg_selected_inactive=#808080
hover_overlay=#808080
shadow=#000000
scrollbar=#808080
# Lines: the bevel shadows
border=#808080
border_strong=#404040
rule=#808080
# Text
fg=#000000
fg_text=#000000
fg_strong=#000000
fg_bright=#ffffff
fg_muted=#404040
fg_subtle=#606060
fg_faint=#808080
# Accent: the title bar navy
accent=#000080
accent_hover=#0000a0
accent_fg=#000080
accent_text=#ffffff
focus_ring=#000000
link=#0000ff
error=#c00000
warning=#6b6b00
success=#008000
highlight=#ffff00
highlight_fg=#000000
# Badges
badge_red=#800000
badge_green=#008000
badge_blue=#000080
badge_orange=#808000
badge_fg=#ffffff
# Git
git_modified=#808000
git_added=#008000
git_deleted=#800000
git_conflict=#ff0000
git_renamed=#000080
# File-type icons
icon_blue=#000080
icon_grey=#808080
icon_grey_light=#606060
icon_green=#008000
icon_orange=#6b6b00
icon_pink=#800080
icon_purple=#800080
icon_red=#800000
icon_white=#000000
icon_yellow=#808000
icon_ignore=#808080
gutter_added=#008000
gutter_modified=#0000ff
gutter_deleted=#ff0000
diff_added_fg=#006000
diff_added_bg=#e0ffe0
diff_removed_fg=#800000
diff_removed_bg=#ffe0e0
diff_hunk_fg=#800080
diff_hunk_bg=#e8e8ff
# Syntax: keywords and comments, the rest stays black
syn_comment=#008000
syn_keyword=#0000ff
syn_control=#0000ff
syn_string=#000000
syn_number=#000000
syn_type=#000000
syn_function=#000000
syn_variable=#000000
syn_escape=#000000
syn_constant=#0000ff
syn_error=#ff0000
# Editors
editor_selection=#a6caf0
editor_current_line=#f4f4f4
editor_cursor=#000000
editor_bracket=#c0c0c0
editor_occurrence=#e0e0e0
editor_match=#ffff00
editor_match_current=#00ffff
editor_ruler=#c00000
# Terminal: the console's 16 colours
term_fg=#c0c0c0
term_cursor=#c0c0c0
ansi_black=#000000
ansi_red=#800000
ansi_green=#008000
ansi_yellow=#808000
ansi_blue=#000080
ansi_magenta=#800080
ansi_cyan=#008080
ansi_white=#c0c0c0
ansi_bright_black=#808080
ansi_bright_red=#ff0000
ansi_bright_green=#00ff00
ansi_bright_yellow=#ffff00
ansi_bright_blue=#0000ff
ansi_bright_magenta=#ff00ff
ansi_bright_cyan=#00ffff
ansi_bright_white=#ffffff

[Fonts]
ui=MS Sans Serif, Microsoft Sans Serif, Arial, sans-serif
ui_size=12
code=Fixedsys, Courier New, Courier, monospace
code_size=13
