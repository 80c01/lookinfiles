# 2010s: flat design and the dark editor. Warm charcoal surfaces with no
# gradients or bevels, vivid flat accents, bright syntax colours on dark
# (the Monokai palette of the decade's popular text editors, its pink and
# comments a little lighter to stay readable),
# badges with dark text on bright fills.
[Theme]
name=2010s Flat Dark
dark=true

