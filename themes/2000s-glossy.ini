# 2000s: the glossy desktop (Windows XP Luna, Mac OS X Aqua) and Web 2.0.
# Warm beige surfaces, saturated blue selections, blue headings, a white
# terminal, yellow-tinted search hits. Syntax colouring as in the IDEs of
# the decade: blue keywords, green comments, dark red strings, teal types.
[Theme]
name=2000s Glossy
dark=false

